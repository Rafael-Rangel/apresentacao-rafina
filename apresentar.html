<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARA Systems x Rafina — Proposta Comercial</title>
<meta name="description" content="Proposta comercial da ARA Systems para a Rafina: site, CRM KoruVision, social media, audiovisual, tráfego pago e treinamento.">
<meta name="theme-color" content="#08060a">
<link rel="icon" href="imagens/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="imagens/icone-180.png">
<meta name="apple-mobile-web-app-title" content="ARA x Rafina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08060a;
  --ink:#0d0a0e;
  --ink-2:#141017;
  --gold:#c9a227;
  --gold-soft:#e5c87a;
  --gold-dim:rgba(201,162,39,.28);
  --nude:#e8d5c4;
  --text:#f6f0e9;
  --muted:#a89e97;
  --line:rgba(232,213,196,.14);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}

.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#171018 0%,#000 70%)}
.deck{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none}

.slide{position:absolute;inset:0;display:none;background:var(--ink);overflow:hidden;border-radius:2px}
.slide.on{display:block;animation:in .5s cubic-bezier(.22,.61,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pad{position:absolute;inset:0;padding:72px 88px;display:flex;flex-direction:column}
.fit{display:flex;flex-direction:column;flex:1;min-height:0;transform-origin:top left}
.pad.decl>.fit{justify-content:center}

.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(201,162,39,.16) 0%,transparent 62%);filter:blur(10px)}
.glow.tl{top:-380px;left:-260px}
.glow.br{bottom:-420px;right:-300px}

.kicker{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:26px;display:flex;align-items:center;gap:14px}
.kicker::after{content:'';height:1px;width:56px;background:linear-gradient(90deg,var(--gold),transparent)}

h1{font-family:var(--serif);font-weight:300;font-size:74px;line-height:1.06;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:300;font-size:54px;line-height:1.12;letter-spacing:-.01em;margin-bottom:14px}
h3{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.2}
.sub{font-size:19px;line-height:1.62;color:var(--muted);font-weight:300;max-width:860px;margin-bottom:32px}
em.g{font-style:normal;color:var(--gold-soft)}
strong{font-weight:600;color:#fff}

.rule{height:1px;background:linear-gradient(90deg,var(--gold),var(--gold-dim) 30%,transparent);margin:0 0 30px}

/* ---------- capa ---------- */
.capa{position:absolute;inset:0}
.capa .bg{position:absolute;inset:0;background-size:cover;background-position:center right}
.capa .veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(8,6,10,.97) 0%,rgba(8,6,10,.9) 38%,rgba(8,6,10,.35) 72%,rgba(8,6,10,.55) 100%)}
.capa .in{position:absolute;inset:0;padding:0 88px;display:flex;flex-direction:column;justify-content:center;max-width:790px}
.capa h1{font-size:82px;margin:10px 0 26px}
.capa .marca{font-size:15px;letter-spacing:.42em;text-transform:uppercase;color:var(--nude);font-weight:400}
.capa .meta{margin-top:42px;padding-top:26px;border-top:1px solid var(--line);display:flex;gap:34px;font-size:13.5px;color:var(--muted);letter-spacing:.06em}
.capa .meta b{display:block;color:var(--gold-soft);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}

/* ---------- divisor de secao ---------- */
.secao{position:absolute;inset:0}
.secao .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.secao .veil{position:absolute;inset:0;background:linear-gradient(85deg,rgba(8,6,10,.96) 12%,rgba(8,6,10,.72) 52%,rgba(8,6,10,.5) 100%)}
.secao .in{position:absolute;inset:0;padding:0 88px;display:flex;flex-direction:column;justify-content:center}
.secao .num{font-family:var(--serif);font-size:150px;line-height:.8;color:transparent;-webkit-text-stroke:1px var(--gold-dim);margin-bottom:22px}
.secao h1{font-size:78px;max-width:820px}
.secao .sub{margin-top:22px;font-size:21px;max-width:620px;color:var(--nude);opacity:.82}

/* ---------- declaracao ---------- */
.bgfoto{position:absolute;inset:0;background-size:cover;background-position:center right}
.bgveil{position:absolute;inset:0;background:linear-gradient(95deg,rgba(13,10,14,.98) 34%,rgba(13,10,14,.82) 62%,rgba(13,10,14,.5) 100%)}
.decl{justify-content:center}
.decl.comfoto .frase,.decl.comfoto .nota,.decl.comfoto ul{max-width:730px}
.decl .frase{font-family:var(--serif);font-weight:300;font-size:52px;line-height:1.24;max-width:1000px;letter-spacing:-.01em}
.decl .frase p{margin-bottom:22px}
.decl .frase p:last-child{margin-bottom:0}
.decl .nota{margin-top:44px;padding-left:26px;border-left:2px solid var(--gold);font-size:19px;line-height:1.6;color:var(--nude);max-width:760px;font-weight:300}
.decl ul{list-style:none;margin:30px 0 0}
.decl ul li{font-family:var(--sans);font-size:19px;font-weight:300;line-height:1.5;color:var(--muted);padding:11px 0 11px 30px;position:relative;border-bottom:1px solid rgba(232,213,196,.07)}
.decl ul li::before{content:'';position:absolute;left:0;top:21px;width:12px;height:1px;background:var(--gold)}

/* ---------- lista ---------- */
.itens{list-style:none;display:flex;flex-direction:column;gap:2px;flex:1}
.itens li{padding:15px 0;border-top:1px solid rgba(232,213,196,.09);display:flex;gap:22px;align-items:flex-start}
.itens li:last-child{border-bottom:1px solid rgba(232,213,196,.09)}
.itens .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:11px;box-shadow:0 0 0 4px rgba(201,162,39,.12)}
.itens .txt{font-size:18.5px;line-height:1.52;font-weight:300;color:var(--nude)}
.itens .txt b{color:#fff;font-weight:600}
.itens.compact .txt{font-size:17px;line-height:1.45}
.itens.compact li{padding:11px 0}
.cols2{columns:2;column-gap:56px}
.cols2 li{break-inside:avoid}

/* ---------- duas colunas ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;align-content:start}
.painel{border:1px solid var(--line);border-radius:4px;padding:30px 32px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.008))}
.painel.neg{border-color:rgba(180,120,120,.22)}
.painel.pos{border-color:var(--gold-dim);background:linear-gradient(160deg,rgba(201,162,39,.09),rgba(201,162,39,.015))}
.painel h4{font-family:var(--serif);font-size:27px;font-weight:400;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.painel.neg h4{color:#d9a9a2}
.painel.pos h4{color:var(--gold-soft)}
.painel ul{list-style:none}
.painel li{font-size:16px;line-height:1.5;font-weight:300;color:var(--nude);padding:8px 0 8px 20px;position:relative}
.painel li::before{content:'';position:absolute;left:0;top:15px;width:8px;height:1px;background:var(--gold-dim)}
.painel.pos li::before{background:var(--gold)}
.painel li b{color:#fff;font-weight:600}

/* ---------- cenario antes/depois ---------- */
.cen{display:grid;grid-template-columns:1fr 1fr;gap:30px;flex:1;align-content:center}
.cen .box{border-radius:4px;padding:32px 34px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column}
.cen .box.hi{border-color:var(--gold-dim);background:linear-gradient(165deg,rgba(201,162,39,.1),rgba(201,162,39,.02))}
.cen .tag{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.cen .box.hi .tag{color:var(--gold)}
.cen .fala{font-family:var(--serif);font-size:27px;line-height:1.34;color:var(--nude);margin-bottom:20px}
.cen .box.hi .fala{color:#fff}
.cen ul{list-style:none;margin-top:auto}
.cen li{font-size:16px;line-height:1.5;font-weight:300;color:var(--muted);padding:7px 0 7px 19px;position:relative}
.cen li::before{content:'';position:absolute;left:0;top:14px;width:8px;height:1px;background:var(--gold-dim)}
.cen .box.hi li{color:var(--nude)}
.cen .selo{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;color:var(--gold-soft);letter-spacing:.04em}

/* ---------- comparativo ---------- */
.tab{width:100%;border-collapse:collapse;font-weight:300}
.tab th{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 22px 14px;border-bottom:1px solid var(--line)}
.tab th.b{color:var(--gold)}
.tab td{font-size:16.5px;line-height:1.4;padding:13px 22px;border-bottom:1px solid rgba(232,213,196,.07);color:var(--muted);vertical-align:top;width:50%}
.tab td.b{color:#fff;font-weight:400;background:linear-gradient(90deg,rgba(201,162,39,.075),rgba(201,162,39,.02))}
.tab tr:last-child td{border-bottom:none}

/* ---------- ciclo ---------- */
.ciclo{display:flex;gap:0;flex:1;align-items:center}
.ciclo .et{flex:1;text-align:center;padding:0 8px;position:relative}
.ciclo .n{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:21px;color:var(--gold-soft);background:radial-gradient(circle,rgba(201,162,39,.14),transparent 70%)}
.ciclo .t{font-family:var(--serif);font-size:24px;margin-bottom:9px;color:#fff}
.ciclo .d{font-size:14.5px;line-height:1.45;color:var(--muted);font-weight:300}
.ciclo .seta{flex:none;width:34px;color:var(--gold-dim);font-size:19px;text-align:center;padding-bottom:52px}

/* ---------- pacotes ---------- */
.pacs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:16px;flex:1;align-content:stretch}
.pac{border:1px solid var(--line);border-radius:4px;padding:22px 20px;display:flex;flex-direction:column;background:linear-gradient(170deg,rgba(255,255,255,.035),rgba(255,255,255,.006))}
.pac.dest{border-color:var(--gold);background:linear-gradient(170deg,rgba(201,162,39,.13),rgba(201,162,39,.02));box-shadow:0 0 44px rgba(201,162,39,.1)}
.pac .fx{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);height:16px;margin-bottom:8px}
.pac h4{font-family:var(--serif);font-size:28px;font-weight:400;margin-bottom:4px}
.pac .lin{font-size:11.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.pac ul{list-style:none;flex:1}
.pac li{font-size:14px;line-height:1.4;font-weight:300;color:var(--nude);padding:6px 0 6px 17px;position:relative}
.pac li::before{content:'+';position:absolute;left:0;top:6px;color:var(--gold);font-size:14px}
.pac .val{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.pac .val .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pac .val .v{font-family:var(--serif);font-size:24px;color:var(--gold-soft);line-height:1.2}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:1;align-content:center}
.tl .f{padding:0 26px 0 0;position:relative}
.tl .f::before{content:'';position:absolute;left:0;top:32px;right:0;height:1px;background:var(--gold-dim)}
.tl .f:last-child::before{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.tl .b{width:14px;height:14px;border-radius:50%;background:var(--ink);border:1px solid var(--gold);position:relative;top:26px;box-shadow:0 0 0 5px var(--ink),0 0 16px rgba(201,162,39,.5)}
.tl .m{margin-top:52px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
.tl .t{font-family:var(--serif);font-size:29px;margin-bottom:11px;line-height:1.15}
.tl .d{font-size:15.5px;line-height:1.5;color:var(--muted);font-weight:300;padding-right:14px}

/* ---------- preco ---------- */
.prec{display:flex;flex-direction:column;flex:1;justify-content:center}
.prec .linhas{display:flex;flex-direction:column;gap:14px}
.prec .l{display:flex;align-items:flex-start;gap:26px;padding:19px 26px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent)}
.prec .l.hi{border-color:var(--gold-dim);background:linear-gradient(120deg,rgba(201,162,39,.1),transparent)}
.prec .l .esq{flex:1}
.prec .l .nome{font-family:var(--serif);font-size:26px;margin-bottom:6px}
.prec .l .desc{font-size:15px;line-height:1.5;color:var(--muted);font-weight:300}
.prec .l .dir{flex:none;text-align:right;min-width:210px}
.prec .l .v{font-family:var(--serif);font-size:34px;color:var(--gold-soft);line-height:1.1}
.prec .l .cond{font-size:12.5px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.prec .obs{margin-top:26px;padding:18px 24px;border-left:2px solid var(--gold);background:rgba(201,162,39,.06);font-size:16px;line-height:1.55;color:var(--nude);font-weight:300}
.prec .obs b{color:#fff}
.vazio{color:var(--gold);border-bottom:1px dashed var(--gold-dim);padding-bottom:1px}

/* ---------- contato ---------- */
.fim{position:absolute;inset:0}
.fim .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.fim .veil{position:absolute;inset:0;background:linear-gradient(260deg,rgba(8,6,10,.96) 20%,rgba(8,6,10,.72) 60%,rgba(8,6,10,.4) 100%)}
.fim .in{position:absolute;inset:0;padding:0 88px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
.fim .passos{list-style:none;margin:28px 0 40px;max-width:620px}
.fim .passos li{font-size:17.5px;line-height:1.5;font-weight:300;color:var(--nude);padding:11px 0;border-bottom:1px solid rgba(232,213,196,.08);display:flex;gap:16px;justify-content:flex-end}
.fim .passos .n{color:var(--gold);font-family:var(--serif);font-size:19px;min-width:22px}
.fim .card{border:1px solid var(--gold-dim);border-radius:4px;padding:24px 34px;background:rgba(201,162,39,.06);text-align:right}
.fim .card .m{font-size:14px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:12px}
.fim .card .c{font-size:16px;color:var(--nude);line-height:1.8;font-weight:300}

/* ---------- rodape / hud ---------- */
.rod{position:absolute;left:88px;right:88px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(168,158,151,.62);pointer-events:none}
.rod .bloco{color:var(--gold);opacity:.75}
.barra{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .45s ease;z-index:5}

.hud{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:40;opacity:0;transition:opacity .25s}
.stage:hover .hud{opacity:1}
.hud button{background:rgba(20,16,23,.9);border:1px solid var(--line);color:var(--nude);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;transition:.2s;backdrop-filter:blur(8px)}
.hud button:hover{border-color:var(--gold);color:var(--gold-soft)}
.hud .conta{width:auto;padding:0 16px;border-radius:19px;font-size:12px;letter-spacing:.1em;cursor:default}

.zonas{position:absolute;inset:0;z-index:6}
.zonas i{position:absolute;top:0;bottom:0;width:16%;cursor:pointer}
.zonas i.l{left:0}
.zonas i.r{right:0;width:34%}

/* ---------- indice ---------- */
.menu{position:fixed;inset:0;background:rgba(6,4,8,.96);z-index:60;display:none;padding:60px 80px;overflow:auto;backdrop-filter:blur(6px)}
.menu.on{display:block}
.menu h3{color:var(--gold);font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-family:var(--sans);font-weight:500;margin-bottom:28px}
.menu .grade{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.menu .it{border:1px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}
.menu .it:hover{border-color:var(--gold);background:rgba(201,162,39,.1)}
.menu .it .n{font-size:10px;color:var(--gold);letter-spacing:.16em;margin-bottom:5px}
.menu .it .t{font-size:14px;color:var(--nude);font-weight:300;line-height:1.35}

/* ---------- objecoes ---------- */
.obj{position:fixed;inset:0;background:rgba(6,4,8,.97);z-index:70;display:none;padding:54px 70px;overflow:auto;backdrop-filter:blur(6px)}
.obj.on{display:block}
.obj .cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}
.obj .cab h3{font-family:var(--serif);font-size:36px;font-weight:300;color:#fff}
.obj .cab span{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.obj .grade{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.obj .c{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:3px;padding:20px 24px;background:rgba(255,255,255,.025)}
.obj .c .q{font-family:var(--serif);font-size:23px;color:var(--gold-soft);margin-bottom:10px}
.obj .c .a{font-size:15.5px;line-height:1.58;color:var(--nude);font-weight:300}
.obj .c .a b{color:#fff;font-weight:600}

/* ---------- celular e telas estreitas ----------
   O deck deixa de ser um palco fixo de 1280x720 e passa a ocupar a tela toda,
   com cada slide rolando na vertical. Toda grade de 2+ colunas vira coluna unica. */
@media (max-width:860px){
  .stage{align-items:stretch;justify-content:stretch;background:var(--ink)}
  .deck{width:100%;height:100vh;height:100dvh;transform:none!important}
  .slide{border-radius:0}
  .slide.on{display:flex;flex-direction:column}

  /* areas de conteudo passam a rolar */
  .capa,.secao,.fim{position:relative;inset:auto;flex:1;min-height:0;display:flex}
  .pad,.capa .in,.secao .in,.fim .in{position:relative;inset:auto;flex:1;min-height:0;
    max-width:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(26px + env(safe-area-inset-top)) 20px 78px}
  .capa .bg,.secao .bg,.fim .bg,.bgfoto{position:absolute}
  .fit{transform:none!important;width:auto!important;flex:0 0 auto}
  .pad.decl>.fit{justify-content:flex-start}
  .glow{width:420px;height:420px}

  /* tipografia */
  h1{font-size:34px}
  h2{font-size:27px}
  h3{font-size:22px}
  .sub{font-size:15px;margin-bottom:22px;max-width:none}
  .kicker{font-size:10.5px;letter-spacing:.24em;margin-bottom:16px}
  .kicker::after{width:28px}
  .rule{margin-bottom:20px}

  .capa h1{font-size:38px;margin:8px 0 18px}
  .capa .in{justify-content:flex-end;padding-bottom:96px}
  .capa .veil{background:linear-gradient(180deg,rgba(8,6,10,.55) 0%,rgba(8,6,10,.9) 45%,rgba(8,6,10,.98) 100%)}
  .capa .meta{margin-top:26px;padding-top:18px;gap:20px;flex-wrap:wrap;font-size:12px}
  .capa .bg{background-position:center}

  .secao .in{justify-content:center}
  .secao .num{font-size:74px;margin-bottom:12px}
  .secao h1{font-size:40px;max-width:none}
  .secao .sub{font-size:16px;margin-top:14px;max-width:none}
  .secao .veil{background:linear-gradient(180deg,rgba(8,6,10,.6),rgba(8,6,10,.95) 60%)}

  .decl .frase{font-size:27px;max-width:none}
  .decl .frase p{margin-bottom:14px}
  .decl .nota{margin-top:24px;padding-left:16px;font-size:15px;max-width:none}
  .decl ul{margin-top:20px}
  .decl ul li{font-size:15px;padding:9px 0 9px 22px}
  .decl ul li::before{top:18px;width:9px}

/* ============================ RENDERIZACAO ============================ */

function rodape(s, i, total){
  return '<div class="rod"><span class="bloco">' + (s.bloco || AGENCIA) + '</span>' +
         '<span>' + AGENCIA + ' &nbsp;·&nbsp; ' + CLIENTE + '</span>' +
         '<span>' + String(i + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0') + '</span></div>';
}
function cabeca(s){
  let h = '';
  if (s.kicker) h += '<div class="kicker">' + s.kicker + '</div>';
  if (s.titulo) h += '<h2>' + tx(s.titulo) + '</h2>';
  if (s.sub) h += '<p class="sub">' + tx(s.sub) + '</p>';
  else if (s.titulo) h += '<div class="rule"></div>';
  return h;
}
function pad(inner, cls){
  return '<div class="pad' + (cls ? ' ' + cls : '') + '"><div class="fit">' + inner + '</div></div>';
}
function listaItens(itens, cols){
  const cls = 'itens' + (itens.length > 6 ? ' compact' : '') + (cols === 2 ? ' cols2' : '');
  return '<ul class="' + cls + '">' + itens.map(it => {
    const t = Array.isArray(it) ? it[0] : it;
    const d = Array.isArray(it) ? it[1] : '';
    return '<li><span class="dot"></span><span class="txt"><b>' + tx(t) + '</b>' + (d ? ' — ' + tx(d) : '') + '</span></li>';
  }).join('') + '</ul>';
}

function render(s, i, total){
  const fundo = '<div class="glow tl"></div><div class="glow br"></div><div class="grain"></div>';
  let corpo = '';

  switch (s.tipo) {

  case 'capa':
    corpo = '<div class="capa">' +
      '<div class="bg" style="background-image:url(' + IMG(s.img) + ')"></div><div class="veil"></div>' + fundo +
      '<div class="in"><div class="marca">' + s.marca + '</div>' +
      '<h1>' + tx(s.titulo) + '</h1><p class="sub" style="font-size:21px;color:var(--nude);opacity:.8;margin:0">' + tx(s.sub) + '</p>' +
      '<div class="meta">' + s.meta.map(m => '<div><b>' + m[0] + '</b>' + tx(m[1]) + '</div>').join('') + '</div></div></div>';
    break;

  case 'secao':
    corpo = '<div class="secao">' +
      '<div class="bg" style="background-image:url(' + IMG(s.img) + ')"></div><div class="veil"></div>' + fundo +
      '<div class="in"><div class="num">' + s.num + '</div><h1>' + tx(s.titulo) + '</h1>' +
      '<p class="sub">' + tx(s.sub) + '</p></div></div>' + rodape(s, i, total);
    break;

  case 'declaracao': {
    let h = '';
    if (s.kicker) h += '<div class="kicker">' + s.kicker + '</div>';
    h += '<div class="frase">' + s.frase.map(f => '<p>' + tx(f) + '</p>').join('') + '</div>';
    if (s.lista) h += '<ul>' + s.lista.map(l => '<li>' + tx(l) + '</li>').join('') + '</ul>';
    if (s.nota) h += '<div class="nota">' + tx(s.nota) + '</div>';
    if (s.fecho) h += '<div style="margin-top:26px;font-family:var(--serif);font-size:32px;color:var(--gold-soft);line-height:1.3">' + tx(s.fecho) + '</div>';
    const foto = s.img
      ? '<div class="bgfoto" style="background-image:url(' + IMG(s.img) + ')"></div><div class="bgveil"></div>'
      : '';
    corpo = foto + fundo + pad(h, 'decl' + (s.img ? ' comfoto' : '')) + rodape(s, i, total);
    break;
  }

  case 'lista': {
    let h = cabeca(s) + listaItens(s.itens, s.cols);
    if (s.nota) h += '<div style="margin-top:20px;padding-left:22px;border-left:2px solid var(--gold);font-size:17px;line-height:1.55;color:var(--nude);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'duo': {
    const col = c => '<div class="painel ' + c.tom + '"><h4>' + tx(c.titulo) + '</h4><ul>' +
      c.itens.map(x => '<li>' + tx(x) + '</li>').join('') + '</ul></div>';
    let h = cabeca(s) + '<div class="duo">' + col(s.colA) + col(s.colB) + '</div>';
    if (s.nota) h += '<div style="margin-top:22px;padding-left:22px;border-left:2px solid var(--gold);font-size:18px;color:var(--nude);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'cenario': {
    const box = (b, hi) => '<div class="box' + (hi ? ' hi' : '') + '"><div class="tag">' + b.tag + '</div>' +
      '<div class="fala">' + tx(b.fala) + '</div><ul>' + b.itens.map(x => '<li>' + tx(x) + '</li>').join('') + '</ul>' +
      '<div class="selo">' + tx(b.selo) + '</div></div>';
    corpo = fundo + pad(cabeca(s) + '<div class="cen">' + box(s.antes, false) + box(s.depois, true) + '</div>') +
      rodape(s, i, total);
    break;
  }

  case 'comparativo': {
    const linhas = s.linhas.map(l => '<tr><td>' + tx(l[0]) + '</td><td class="b">' + tx(l[1]) + '</td></tr>').join('');
    corpo = fundo + pad(cabeca(s) +
      '<table class="tab"><thead><tr><th>' + s.cabA + '</th><th class="b">' + s.cabB + '</th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table>') + rodape(s, i, total);
    break;
  }

  case 'ciclo': {
    const et = s.passos.map((x, k) => '<div class="et"><div class="n">' + (k + 1) + '</div>' +
      '<div class="t">' + tx(x[0]) + '</div><div class="d">' + tx(x[1]) + '</div></div>').join('<div class="seta">&#8594;</div>');
    let h = cabeca(s) + '<div class="ciclo">' + et + '</div>';
    if (s.nota) h += '<div style="margin-top:10px;padding-left:22px;border-left:2px solid var(--gold);font-size:18px;color:var(--nude);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'pacotes': {
    const cards = s.cards.map(c => '<div class="pac' + (c.dest ? ' dest' : '') + '">' +
      '<div class="fx">' + (c.fx || '') + '</div><h4>' + c.nome + '</h4><div class="lin">' + c.linha + '</div>' +
      '<ul>' + c.itens.map(x => '<li>' + tx(x) + '</li>').join('') + '</ul>' +
      '<div class="val"><div class="g"><div class="l">Entrada</div><div class="v">' + tx(c.entrada) + '</div></div>' +
      '<div class="g"><div class="l">Mensal</div><div class="v">' + tx(c.mensal) + '</div></div></div></div>').join('');
    let h = cabeca(s) + '<div class="pacs">' + cards + '</div>';
    if (s.nota) h += '<div style="margin-top:18px;font-size:15.5px;line-height:1.5;color:var(--muted);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'timeline': {
    const f = s.fases.map(x => '<div class="f"><div class="b"></div><div class="m">' + x[0] + '</div>' +
      '<div class="t">' + x[1] + '</div><div class="d">' + tx(x[2]) + '</div></div>').join('');
    corpo = fundo + pad(cabeca(s) + '<div class="tl">' + f + '</div>') + rodape(s, i, total);
    break;
  }

  case 'preco': {
    const linhas = s.linhas.map(l => '<div class="l' + (l.hi ? ' hi' : '') + '">' +
      '<div class="esq"><div class="nome">' + tx(l.nome) + '</div><div class="desc">' + tx(l.desc) + '</div></div>' +
      '<div class="dir"><div class="v">' + tx(l.valor) + '</div><div class="cond">' + l.cond + '</div></div></div>').join('');
    corpo = fundo + pad(cabeca(s) + '<div class="prec"><div class="linhas">' + linhas + '</div>' +
      (s.obs ? '<div class="obs">' + tx(s.obs) + '</div>' : '') + '</div>') + rodape(s, i, total);
    break;
  }

  case 'contato':
    corpo = '<div class="fim"><div class="bg" style="background-image:url(' + IMG(s.img) + ')"></div><div class="veil"></div>' + fundo +
      '<div class="in"><div class="kicker" style="justify-content:flex-end">' + s.kicker + '</div>' +
      '<h2 style="font-size:52px">' + tx(s.titulo) + '</h2>' +
      '<ol class="passos">' + s.passos.map((x, k) => '<li><span class="n">' + (k + 1) + '</span><span>' + tx(x) + '</span></li>').join('') + '</ol>' +
      '<div style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">' + tx(s.validade) + '</div>' +
      '</div></div>';
    break;
  }

  return '<section class="slide" data-i="' + i + '">' + corpo + '<div class="barra" style="width:' +
    ((i + 1) / total * 100) + '%"></div></section>';
}

/* ============================== MOTOR ============================== */
const deck = document.getElementById('deck');
const total = SLIDES.length;
deck.innerHTML = SLIDES.map((s, i) => render(s, i, total)).join('');
const slides = Array.from(deck.querySelectorAll('.slide'));
let atual = 0;

function ir(n){
  atual = Math.max(0, Math.min(total - 1, n));
  slides.forEach((el, i) => el.classList.toggle('on', i === atual));
  document.getElementById('bConta').textContent = (atual + 1) + ' / ' + total;
  location.hash = atual + 1;
  // no celular cada slide rola: o novo slide sempre comeca do topo
  slides[atual].querySelectorAll('.pad, .in').forEach(el => el.scrollTop = 0);
}
const prox = () => ir(atual + 1);
const ant  = () => ir(atual - 1);

/* No celular o deck ocupa a tela inteira e cada slide rola; o palco fixo de
   1280x720 e a reducao automatica de texto valem so a partir de 861px. */
const telaPequena = () => window.matchMedia('(max-width:860px)').matches;

function escala(){
  if (telaPequena()) { deck.style.transform = ''; return; }
  const m = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  deck.style.transform = 'scale(' + m + ')';
}
window.addEventListener('resize', () => { escala(); ajustar(); });
window.addEventListener('orientationchange', () => setTimeout(() => { escala(); ajustar(); }, 250));

/* impede que qualquer slide com muito texto transborde os 720px */
function ajustar(){
  slides.forEach(el => {
    const fit = el.querySelector('.fit');
    if (!fit) return;
    if (telaPequena()) { fit.style.transform = ''; fit.style.width = ''; return; }
    const oculto = !el.classList.contains('on');
    if (oculto) { el.style.visibility = 'hidden'; el.style.display = 'block'; }
    fit.style.transform = ''; fit.style.width = '';
    for (let n = 0; n < 2; n++) {
      const disp = fit.clientHeight, real = fit.scrollHeight;
      if (real <= disp + 1) break;
      const k = Math.max(.55, (disp / real) * 0.99);
      fit.style.transform = 'scale(' + k + ')';
      fit.style.width = (100 / k) + '%';
    }
    if (oculto) { el.style.visibility = ''; el.style.display = ''; }
  });
}

document.addEventListener('keydown', e => {
  const menuAberto = document.getElementById('menu').classList.contains('on');
  const objAberto = document.getElementById('obj').classList.contains('on');
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); prox(); break;
    case 'ArrowLeft': case 'PageUp': ant(); break;
    case 'Home': ir(0); break;
    case 'End': ir(total - 1); break;
    case 'f': case 'F': tela(); break;
    case 'g': case 'G': painel('menu'); break;
    case 'o': case 'O': if (APRESENTADOR) painel('obj'); break;
    case 'Escape': if (menuAberto) painel('menu'); if (objAberto) painel('obj'); break;
  }
});

function tela(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}
function painel(id){
  const outro = id === 'menu' ? 'obj' : 'menu';
  document.getElementById(outro).classList.remove('on');
  document.getElementById(id).classList.toggle('on');
}

document.getElementById('bNext').onclick = prox;
document.getElementById('bPrev').onclick = ant;
document.getElementById('bFull').onclick = tela;
document.getElementById('bMenu').onclick = () => painel('menu');
document.getElementById('bObj').onclick = () => painel('obj');
if (!APRESENTADOR) document.getElementById('bObj').remove();

/* zonas de clique */
const zonas = document.createElement('div');
zonas.className = 'zonas';
zonas.innerHTML = '<i class="l"></i><i class="r"></i>';
document.querySelector('.stage').appendChild(zonas);
zonas.querySelector('.l').onclick = ant;
zonas.querySelector('.r').onclick = prox;

/* swipe — so troca de slide quando o gesto e claramente horizontal,
   para nao atrapalhar a rolagem vertical do conteudo no celular */
let x0 = null, y0 = null;
addEventListener('touchstart', e => {
  x0 = e.touches[0].clientX;
  y0 = e.touches[0].clientY;
}, {passive:true});
addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? prox : ant)();
  x0 = y0 = null;
}, {passive:true});

/* indice */
document.getElementById('menuGrade').innerHTML = SLIDES.map((s, i) => {
  const t = s.titulo || s.marca || (s.frase ? s.frase[0].replace(/<[^>]+>/g, '') : 'Slide');
  return '<div class="it" data-go="' + i + '"><div class="n">' + String(i + 1).padStart(2, '0') +
    ' · ' + (s.bloco || 'Capa') + '</div><div class="t">' + t + '</div></div>';
}).join('');
document.getElementById('menuGrade').onclick = e => {
  const it = e.target.closest('.it');
  if (!it) return;
  ir(+it.dataset.go);
  painel('menu');
};
document.getElementById('menu').onclick = e => { if (e.target.id === 'menu') painel('menu'); };

/* objecoes */
if (APRESENTADOR) {
  document.getElementById('obj').innerHTML =
    '<div class="cab"><h3>Respostas para as objeções</h3><span>Painel interno · tecla O para fechar</span></div>' +
    '<div class="grade">' + OBJECOES.map(o =>
      '<div class="c"><div class="q">' + o[0] + '</div><div class="a">' + o[1] + '</div></div>').join('') + '</div>';
  document.getElementById('obj').onclick = e => { if (e.target.id === 'obj') painel('obj'); };
}

/* link direto para um slide e botao voltar do navegador */
addEventListener('hashchange', () => {
  const n = (parseInt(location.hash.slice(1), 10) || 1) - 1;
  if (n !== atual) ir(n);
});

escala();
ir(location.hash ? (parseInt(location.hash.slice(1), 10) || 1) - 1 : 0);
ajustar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
window.addEventListener('load', ajustar);
window.addEventListener('beforeprint', ajustar);
</script>
</body>
</html>
